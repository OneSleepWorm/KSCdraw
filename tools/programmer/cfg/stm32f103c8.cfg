# STM32F103C8 (72MHz, 64KB Flash, 20KB SRAM)
# Allow clone chips with non-standard idcode (e.g. 0x2ba01477)
set CPUTAPID 0
source [find target/stm32f1x.cfg]

# Override flash size for C8 variant (64KB)
set FLASH_SIZE 0x10000

# Use 16KB work area from SRAM
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x4000
